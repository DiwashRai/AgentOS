[project]
name = "agentos"
version = "0.1.0"
description = "AgentOS server: tickets, context bundles and agent runs"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143.0",
    "httpx>=0.28.1",
    "jinja2>=3.1.6",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "uvicorn[standard]>=0.54.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["server/agentos"]

# ---------------------------------------------------------------- ruff
[tool.ruff]
line-length = 100
# The worker must run on Python 3.11 runners, so the whole backend stays 3.11-compatible.
target-version = "py311"
src = ["server", "worker"]

[tool.ruff.lint]
select = [
    "E", "F", "W", "I", "B", "UP", "SIM", "S", "RUF", "PT", "ASYNC", "C4", "RET", "PTH", "ERA", "DTZ",
    "BLE001", "PGH003", "TID251",
]

# The pure core (import-linter's first contract) never reads the clock. TID251 applies only
# there: every other file ignores it (the negated glob below).
[tool.ruff.lint.flake8-tidy-imports.banned-api]
"datetime.datetime.now".msg = "pure core takes `now` as an argument"
"datetime.datetime.utcnow".msg = "pure core takes `now` as an argument"
"datetime.datetime.today".msg = "pure core takes `now` as an argument"
"datetime.date.today".msg = "pure core takes `now` as an argument"
"time.time".msg = "pure core takes `now` as an argument"
"time.monotonic".msg = "pure core takes `now` as an argument"
"agentos.clock.utcnow".msg = "pure core takes `now` as an argument"

[tool.ruff.lint.per-file-ignores]
"!server/agentos/{models.py,validate.py,errors.py,pipeline/**,*/board.py,*/rules.py}" = ["TID251"]
"**/tests/**" = ["S101", "S603", "S607"]
"**/worker_tests/**" = ["S101", "S603", "S607"]
# Running subprocesses described by the manifest is the worker's job.
"worker/worker.py" = ["S603", "S607"]

[tool.ruff.lint.isort]
known-first-party = ["agentos", "worker"]

# ---------------------------------------------------------------- mypy
[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
mypy_path = ["server", "worker"]
explicit_package_bases = true
files = ["server/agentos", "server/tests", "worker/worker.py", "worker/worker_tests"]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true

# ---------------------------------------------------------------- pytest
[tool.pytest.ini_options]
testpaths = ["server/tests", "worker/worker_tests"]
pythonpath = ["worker"]
# Default (prepend) import mode: importlib mode would shadow worker.py with a `worker` namespace
# package. Worker tests live in worker/worker_tests so both suites can have a conftest.py without
# mypy seeing two packages named `tests`. Keep test file basenames unique across suites.
addopts = "-q"
# live/ holds checks against real services, run by hand (backend/AGENTS.md › Testing): never collected.
norecursedirs = [".*", "*.egg", "build", "dist", "node_modules", "venv", "live"]

# ---------------------------------------------------------------- import-linter
[tool.importlinter]
root_package = "agentos"
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Pure core: no web, db, http or config"
type = "forbidden"
source_modules = [
    "agentos.models", "agentos.validate", "agentos.errors", "agentos.pipeline",
    "agentos.*.board", "agentos.*.rules",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn", "httpx", "sqlite3", "agentos.db", "agentos.config"]
broken_contract_guidance = "Pure modules take plain values as arguments. Load data in a service and pass it in."

[[tool.importlinter.contracts]]
name = "Inside a feature: routes -> deps -> loops -> service -> board"
type = "layers"
containers = [
    "agentos.auth", "agentos.tickets", "agentos.files", "agentos.runs",
    "agentos.social", "agentos.templates", "agentos.worker_api", "agentos.intake",
    "agentos.settings", "agentos.mailbox", "agentos.workflows", "agentos.clients",
]
layers = [
    "(routes)",
    "(deps)",
    "(dispatcher) | (reaper)",
    "(service)",
    "(board)",
]

[[tool.importlinter.contracts]]
name = "The HTTP layer reaches the database only through services"
type = "forbidden"
source_modules = ["agentos.*.routes", "agentos.*.deps", "agentos.meta"]
forbidden_modules = ["agentos.db", "sqlite3"]
allow_indirect_imports = true
broken_contract_guidance = "Routes parse input, call one service function and return its result. Services own transactions (db.tx())."

[[tool.importlinter.contracts]]
name = "Only agentos.db imports sqlite3"
type = "protected"
protected_modules = ["sqlite3"]
allowed_importers = ["agentos.db"]
broken_contract_guidance = "Use agentos.db's re-exports (Conn, IntegrityError, tx). Keeps a Postgres swap to one module."

[[tool.importlinter.contracts]]
name = "Only the HTTP layer imports FastAPI/Starlette"
type = "forbidden"
source_modules = [
    "agentos.*.service", "agentos.*.board", "agentos.*.dispatcher", "agentos.*.reaper",
    "agentos.db", "agentos.config", "agentos.errors",
    "agentos.launchers", "agentos.sources", "agentos.stores",
]
forbidden_modules = ["fastapi", "starlette", "uvicorn"]
broken_contract_guidance = "Raise agentos.errors.ApiError (pure). Translation to HTTP responses lives in agentos.http_errors."

[[tool.importlinter.contracts]]
name = "Plugins are adapters: no db, services or HTTP layer"
type = "forbidden"
source_modules = ["agentos.launchers", "agentos.sources", "agentos.stores"]
forbidden_modules = [
    "fastapi", "starlette", "sqlite3", "agentos.db", "agentos.*.service", "agentos.*.routes",
]
broken_contract_guidance = "Plugins receive what they need as arguments. A fork adds plugins without touching the schema."

[[tool.importlinter.contracts]]
name = "No import cycles between agentos subpackages"
type = "acyclic_siblings"
ancestors = ["agentos"]
broken_contract_guidance = "Direction: worker_api -> runs -> social -> tickets -> workflows -> templates | files | clients -> auth (clients is a leaf: its tokens, and who is online). To read another feature's tables, query them in your own service instead of importing upwards."

[dependency-groups]
dev = [
    "complexipy==8.0.1",
    "import-linter>=2.15",
    "lizard==1.24.1",
    "mypy>=2.4.0",
    "pytest>=9.1.1",
    "pytest-randomly>=5.0.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.17.0",
]
